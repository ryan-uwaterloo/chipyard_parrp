# 4-core trace generation with a shared data region.
#
# 64 total sets: 16 reserved for sharing (sets 48-63), 48 left over for
# private use, split 12/12/12/12 across the 4 cores (sets 0-11, 12-23,
# 24-35, 36-47 respectively).
#
# Core 0 is the producer (mostly stores to the shared pool); cores 1-3 are
# consumers (mostly loads). Change shared.tag_range / each core's
# shared_load_prob to reshape this into a contended-sync-variable test
# (tag_range: 1, all cores ~0.5 load_prob) or a migratory pattern
# (small tag_range, alternating roles).

seed: 42
base_addr: 0x40000000

cache:
  line_size_bytes: 64
  num_sets_total: 64

shared:
  num_sets: 16
  tag_range: 1            # 16 sets * 8 tags = 128 distinct shared addresses
  prime: true
  prime_from_all_cores: true   # every core primes the full shared pool at the start of its own trace
  priming_owner: 0              # ignored when prime_from_all_cores is true
  priming_op_type: LOAD
  priming_comp_delay: 100
  priming_comp_delay_jitter: 15

output:
  pattern: "../../csv/test_cases/tracegen_hol/core_{core_id}_data.csv"
  delimiter: ","

cores:
  - sets_per_partition: 8
    priming:
      associativity: 10
      op_type: STORE
      comp_delay: 100
      comp_delay_jitter: 15
    random_phase:
      num_ops: 1000
      addr_pool: primed
      tag_range: 64
      load_prob: 0
      comp_delay: 1000
      comp_delay_jitter: 20000
      priming_delay: 50000000
      priming_delay_jitter: 0
      parallel_start_width: 4
      shared_access_prob: 0.5
      shared_load_prob: 0.05   # producer: mostly stores to the shared pool

  - sets_per_partition: 8
    priming:
      associativity: 10
      op_type: STORE
      comp_delay: 100
      comp_delay_jitter: 15
    random_phase:
      num_ops: 1000
      addr_pool: primed
      tag_range: 64
      load_prob: 0
      comp_delay: 1000
      comp_delay_jitter: 20000
      priming_delay: 50000000
      priming_delay_jitter: 0
      parallel_start_width: 4
      shared_access_prob: 0.5
      shared_load_prob: 0.05   # consumer: mostly loads from the shared pool

  - sets_per_partition: 8
    priming:
      associativity: 10
      op_type: STORE
      comp_delay: 100
      comp_delay_jitter: 15
    random_phase:
      num_ops: 1000
      addr_pool: primed
      tag_range: 64
      load_prob: 0
      comp_delay: 1000
      comp_delay_jitter: 20000
      priming_delay: 50000000
      priming_delay_jitter: 0
      parallel_start_width: 4
      shared_access_prob: 0.5
      shared_load_prob: 0.05

  - sets_per_partition: 8
    priming:
      associativity: 10
      op_type: STORE
      comp_delay: 100
      comp_delay_jitter: 15
    random_phase:
      num_ops: 1000
      addr_pool: region
      tag_range: 64
      load_prob: 0
      comp_delay: 1000
      comp_delay_jitter: 20000
      priming_delay: 50000000
      priming_delay_jitter: 0
      parallel_start_width: 4
      shared_access_prob: 0.5
      shared_load_prob: 0.05
